server:
  port: 3003

spring:
  application:
    name: parking-garage
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/parking_garage?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:parking}
    password: ${DB_PASSWORD:parking}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

simulator:
  base-url: ${SIMULATOR_URL:http://127.0.0.1:3000}
  startup-max-attempts: ${SIMULATOR_STARTUP_MAX_ATTEMPTS:30}
  startup-delay-millis: ${SIMULATOR_STARTUP_DELAY_MILLIS:2000}

springdoc:
  api-docs:
    path: /docs-json
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.example.parking: DEBUG

parking:
  pricing:
    factor:
      discount: ${PARKING_PRICING_FACTOR_DISCOUNT:0.90}
      normal: ${PARKING_PRICING_FACTOR_NORMAL:1.00}
      plus-step1: ${PARKING_PRICING_FACTOR_PLUS_STEP1:1.10}
      plus-step2: ${PARKING_PRICING_FACTOR_PLUS_STEP2:1.25}
    tolerance-minutes: ${PARKING_PRICING_TOLERANCE_MINUTES:30}