server:
  port: 3003

spring:
  application:
    name: parking-garage
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/parking_garage?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:parking}
    password: ${DB_PASSWORD:parking}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

simulator:
  base-url: ${SIMULATOR_URL:http://127.0.0.1:3000}

springdoc:
  api-docs:
    path: /docs-json
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.example.parking: INFO